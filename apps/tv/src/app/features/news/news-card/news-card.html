<article class="news-card">
  <div class="news-card__meta">
    <span class="news-card__category">{{ categoryLabel() }}</span>
    <span class="news-card__age">{{ ageLabel() }}</span>
  </div>

  <h1 class="news-card__title">{{ item().title }}</h1>

  <p class="news-card__summary">{{ item().summary }}</p>

  <div class="news-card__why">
    <span class="news-card__why-label">Por qué importa</span>
    <p>{{ item().why_it_matters }}</p>
  </div>

  <div class="news-card__footer">
    <span>Confianza: {{ confidencePercent() }}%</span>
    <span>{{ item().sources_count }} fuentes</span>
  </div>
</article>
