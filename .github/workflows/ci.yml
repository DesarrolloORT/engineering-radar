name: CI

on:
  push:
  pull_request:

jobs:
  news-intelligence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/news-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  radar-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/radar-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test

  # apps/tv (Angular) job is added once that app exists (docs/05-backlog.md, Fase 3).
