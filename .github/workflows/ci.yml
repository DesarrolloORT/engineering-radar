name: CI

on:
  push:
  pull_request:

jobs:
  news-intelligence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/news-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  radar-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/radar-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test

  tv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build
